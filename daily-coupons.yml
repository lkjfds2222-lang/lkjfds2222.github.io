name: 雞省研究所｜每日核對與自動更新
on:
  workflow_dispatch:
  schedule:
    # 台灣每天 09:17（UTC 01:17）；GitHub 可能延後執行
    - cron: '17 1 * * *'
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: kfc-coupon-check
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 更新腳本單元測試
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: 更新 KCouper 與優惠文章資料
        id: refresh
        continue-on-error: true
        run: python scripts/update_coupons.py
      - name: 生成警告與 Issues 提醒
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/report_alerts.py '${{ steps.refresh.outcome }}'
      - name: 記錄已通過的更新與待審資訊
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coupons.json update-status.json pending-review.json alerts.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh KFC coupon checks'
            git push
          fi
      - name: 準備靜態網站
        run: |
          mkdir -p _site
          cp index.html coupons.json update-status.json pending-review.json alerts.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
