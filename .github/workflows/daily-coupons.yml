name: 雞省研究所｜每日核對與自動更新

on:
  workflow_dispatch:
  schedule:
    # 台灣時間每天 09:17；排程可能延遲
    - cron: '17 1 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v3.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'app-icon.svg'
      - '*.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/daily-coupons.yml'

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: kfc-coupon-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 取得儲存庫檔案
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 執行既有測試
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: 更新 KCouper 與優惠文章資料
        id: refresh
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/update_coupons.py

      - name: 巡查官方活動（有安裝程式時）
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if [ -f scripts/official_monitor.py ]; then
            python scripts/official_monitor.py
          else
            echo '::notice::未安裝官方來源巡查程式，本次略過'
          fi

      - name: 產生更新警告
        if: github.event_name != 'push' && always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/report_alerts.py '${{ steps.refresh.outcome }}'

      - name: 寫回優惠券資料（失敗不影響部署）
        id: save_data
        if: github.event_name != 'push' && steps.refresh.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=(coupons.json update-status.json pending-review.json alerts.json price-history.json official-offers.json)
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh KFC coupon checks'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo '優惠券資料沒有變更，略過 commit'
          fi

      - name: 提醒檢查資料寫回問題
        if: steps.save_data.outcome == 'failure'
        run: |
          echo '::warning title=優惠資料寫回失敗::本次仍會部署網站，但新資料可能尚未保存到 main，請檢查上一個步驟的 git push 詳細錯誤'
          echo '### ⚠️ 優惠券寫回失敗' >> "$GITHUB_STEP_SUMMARY"
          echo '請檢查分支保護、Actions 寫入權限與 git push 衝突。本次仍繼續部署。' >> "$GITHUB_STEP_SUMMARY"

      - name: 準備網站並檢查重要檔案
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          # 這些檔案是 V3 網站的必要部分，漏傳應讓部署中止。
          for file in index.html v3.js coupons.json; do
            test -s "$file" || { echo "::error::缺少必要檔案 $file"; exit 1; }
            cp "$file" _site/
          done
          # 其它檔案會隨不同版本增加；已存在才複製。
          for file in update-status.json pending-review.json alerts.json price-history.json menu-prices.json official-offers.json manifest.webmanifest sw.js app-icon.svg; do
            if [ -s "$file" ]; then cp "$file" _site/; fi
          done
          touch _site/.nojekyll
          node --check _site/v3.js
          python - <<'PY'
          import json
          from pathlib import Path
          coupons = json.loads(Path('_site/coupons.json').read_text(encoding='utf-8'))
          if not isinstance(coupons, list) or not coupons:
              raise SystemExit('優惠券資料為空或不是列表，停止部署')
          print('資料檢查完成，優惠券數量：', len(coupons))
          PY

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上傳網站
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
